<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Sign In | CampusCare</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Custom Theme Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-split-container">
        <div class="row g-0 align-items-stretch">

            <!-- LEFT SIDE: FORM -->
            <div class="col-12 col-lg-6">
                <div class="auth-form-side">

                    <!-- Brand Header -->
                    <a href="#" class="brand-title">
                        <span class="brand-icon-box brand-icon-maroon">
                            <i class="bi bi-tools"></i>
                        </span>
                        <span>CampusCare</span>
                    </a>

                    <!-- Dynamic Feedback Toast -->
                    <div id="userFeedback" class="feedback-box"></div>

                    <!-- 1. SIGN IN VIEW (DEFAULT) -->
                    <div id="signInContainer">
                        <h1 class="auth-heading">Hello,<br>Welcome Back</h1>
                        <p class="auth-subheading">Hey, welcome back to your campus asset portal</p>

                        <form id="userLoginForm" novalidate>
                            <!-- Email Input -->
                            <div class="form-group-custom">
                                <input type="email" class="form-control-custom" id="loginEmail"
                                    placeholder="user@school.edu.ph" required autocomplete="username">
                            </div>

                            <!-- Password Input with Toggle -->
                            <div class="form-group-custom input-with-action">
                                <input type="password" class="form-control-custom" id="loginPassword"
                                    placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="input-action-btn"
                                    onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')">
                                    <i class="bi bi-eye" id="loginEyeIcon"></i>
                                </button>
                            </div>

                            <!-- Options: Remember Me & Forgot Password -->
                            <div class="auth-options">
                                <div class="form-check m-0 d-flex align-items-center gap-2">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-muted" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="auth-link"
                                    onclick="alert('Password reset instructions will be sent to your school email.'); return false;">Forgot
                                    Password?</a>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" id="loginSubmitBtn" class="btn-auth-submit btn-maroon">
                                Sign In
                            </button>
                        </form>

                        <!-- Toggle to Sign Up (Only on User page) -->
                        <div class="auth-bottom-text">
                            Don't have an account? <a href="#" id="showSignUpLink">Sign Up</a>
                        </div>
                    </div>

                    <!-- 2. CREATE ACCOUNT VIEW (TOGGLED) -->
                    <div id="signUpContainer" style="display: none;">
                        <h1 class="auth-heading">Create an<br>Account</h1>
                        <p class="auth-subheading">Join CampusCare as a student or faculty member</p>

                        <form id="userRegisterForm" novalidate>
                            <!-- First Name & Last Name -->
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <input type="text" class="form-control-custom" id="regFirstName"
                                        placeholder="First Name *" required>
                                </div>
                                <div class="col-6">
                                    <input type="text" class="form-control-custom" id="regLastName"
                                        placeholder="Last Name *" required>
                                </div>
                            </div>

                            <!-- School ID & Middle Name -->
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <input type="text" class="form-control-custom" id="regSchoolId"
                                        placeholder="School ID *" required>
                                </div>
                                <div class="col-6">
                                    <input type="text" class="form-control-custom" id="regMiddleName"
                                        placeholder="Middle Name">
                                </div>
                            </div>

                            <!-- Classification Dropdown -->
                            <div class="form-group-custom">
                                <select class="form-control-custom form-select-custom" id="regUserType" required>
                                    <option value="" disabled selected>Select Classification (Student / Faculty) *
                                    </option>
                                    <option value="student">Student</option>
                                    <option value="faculty">Faculty Member</option>
                                </select>
                            </div>

                            <!-- Institutional Email -->
                            <div class="form-group-custom">
                                <input type="email" class="form-control-custom" id="regEmail"
                                    placeholder="your.name@school.edu *" required>
                            </div>

                            <!-- Password -->
                            <div class="form-group-custom input-with-action">
                                <input type="password" class="form-control-custom" id="regPassword"
                                    placeholder="Create Password (min 6 chars) *" minlength="6" required>
                                <button type="button" class="input-action-btn"
                                    onclick="togglePasswordVisibility('regPassword', 'regEyeIcon')">
                                    <i class="bi bi-eye" id="regEyeIcon"></i>
                                </button>
                            </div>

                            <!-- Confirm Password -->
                            <div class="form-group-custom">
                                <input type="password" class="form-control-custom" id="regConfirmPassword"
                                    placeholder="Confirm Password *" minlength="6" required>
                            </div>

                            <!-- Submit Registration Button -->
                            <button type="submit" id="regSubmitBtn" class="btn-auth-submit btn-green">
                                Sign Up
                            </button>
                        </form>

                        <!-- Toggle back to Sign In -->
                        <div class="auth-bottom-text">
                            Already have an account? <a href="#" id="showSignInLink">Sign In</a>
                        </div>
                    </div>

                </div>
            </div>

            <!-- RIGHT SIDE: VISUAL HERO ARTWORK (FIGMA USER LOGIN) -->
            <div class="col-12 col-lg-6 d-none d-lg-block">
                <div class="auth-visual-side visual-bg-user">
                    <!-- Fluffy Top-Left Cloud -->
                    <div class="cloud-user-top-left"></div>

                    <!-- Fluffy Top-Right Cloud PNG -->
                    <img src="Illustration/userLogin-illustrations/Rounded white cloud.png" alt="Cloud"
                        class="cloud-user-top-right">

                    <!-- Central Storyset Asset Check Artwork PNG -->
                    <img src="Illustration/userLogin-illustrations/pana.png" alt="CampusCare Asset Portal Maintenance"
                        class="user-pana-illustration">

                    <!-- Bottom-Left Organic Shape PNG -->
                    <img src="Illustration/userLogin-illustrations/Ellipse 3.png" alt=""
                        class="ellipse-user-bottom-left">

                    <!-- Bottom-Right Rounded Capsule PNG -->
                    <img src="Illustration/userLogin-illustrations/Rectangle 5.png" alt=""
                        class="rect-user-bottom-right">
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API Client JS -->
    <script src="js/api.js"></script>

    <script>
        const signInContainer = document.getElementById('signInContainer');
        const signUpContainer = document.getElementById('signUpContainer');
        const showSignUpLink = document.getElementById('showSignUpLink');
        const showSignInLink = document.getElementById('showSignInLink');

        // Toggle between Sign In and Sign Up views
        showSignUpLink.addEventListener('click', function (e) {
            e.preventDefault();
            hideFeedback('userFeedback');
            signInContainer.style.display = 'none';
            signUpContainer.style.display = 'block';
        });

        showSignInLink.addEventListener('click', function (e) {
            e.preventDefault();
            hideFeedback('userFeedback');
            signUpContainer.style.display = 'none';
            signInContainer.style.display = 'block';
        });

        // Form submit: User Sign In
        document.getElementById('userLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('loginSubmitBtn');

            if (!email || !password) {
                showFeedback('userFeedback', 'Please provide both your email and password.', 'error');
                return;
            }

            await handleLogin({
                email,
                password,
                portalRole: 'user',
                feedbackId: 'userFeedback',
                submitBtn
            });
        });

        // Form submit: User Sign Up (Students & Faculty only)
        document.getElementById('userRegisterForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const firstName = document.getElementById('regFirstName').value.trim();
            const middleName = document.getElementById('regMiddleName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const schoolId = document.getElementById('regSchoolId').value.trim();
            const userType = document.getElementById('regUserType').value;
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const submitBtn = document.getElementById('regSubmitBtn');

            if (!firstName || !lastName || !schoolId || !userType || !email || !password) {
                showFeedback('userFeedback', 'Please fill in all required fields marked with *.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showFeedback('userFeedback', 'Passwords do not match. Please re-enter carefully.', 'error');
                return;
            }

            await handleUserRegistration({
                email,
                password,
                schoolId,
                firstName,
                middleName,
                lastName,
                userType,
                feedbackId: 'userFeedback',
                submitBtn,
                onSuccess: function (newUser) {
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('userRegisterForm').reset();
                    signUpContainer.style.display = 'none';
                    signInContainer.style.display = 'block';
                }
            });
        });
    </script>
</body>

</html>
