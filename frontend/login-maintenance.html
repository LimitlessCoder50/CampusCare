<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Staff Sign In | CampusCare</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Theme Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-split-container">
        <div class="row g-0 align-items-stretch">

            <!-- LEFT SIDE: FORM -->
            <div class="col-12 col-lg-6">
                <div class="auth-form-side">

                    <!-- Brand Header -->
                    <a href="#" class="brand-title">
                        <span class="brand-icon-box brand-icon-green">
                            <i class="bi bi-tools"></i>
                        </span>
                        <span>CampusCare</span>
                    </a>

                    <!-- Dynamic Feedback Toast -->
                    <div id="maintFeedback" class="feedback-box"></div>

                    <!-- SIGN IN VIEW (MAINTENANCE ONLY) -->
                    <div id="maintSignInContainer">
                        <h1 class="auth-heading">Hello,<br>Welcome Back</h1>
                        <p class="auth-subheading">Hey, welcome back to your maintenance workspace</p>

                        <form id="maintLoginForm" novalidate>
                            <!-- Email Input -->
                            <div class="form-group-custom">
                                <input type="email" class="form-control-custom input-focus-green" id="maintEmail" placeholder="staff.name@campuscare.edu" required autocomplete="username">
                            </div>

                            <!-- Password Input with Toggle -->
                            <div class="form-group-custom input-with-action">
                                <input type="password" class="form-control-custom input-focus-green" id="maintPassword" placeholder="••••••••••••" required autocomplete="current-password">
                                <button type="button" class="input-action-btn" onclick="togglePasswordVisibility('maintPassword', 'maintEyeIcon')">
                                    <i class="bi bi-eye" id="maintEyeIcon"></i>
                                </button>
                            </div>

                            <!-- Options: Remember Me & Forgot Password -->
                            <div class="auth-options">
                                <div class="form-check m-0 d-flex align-items-center gap-2">
                                    <input class="form-check-input form-check-green" type="checkbox" id="maintRememberMe">
                                    <label class="form-check-label text-muted" for="maintRememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="auth-link" onclick="alert('Please contact your Facilities Supervisor to reset your credentials.'); return false;">Forgot Password?</a>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" id="maintSubmitBtn" class="btn-auth-submit btn-green">
                                Sign In
                            </button>
                        </form>
                    </div>

                </div>
            </div>

            <!-- RIGHT SIDE: VISUAL HERO ARTWORK -->
            <div class="col-12 col-lg-6 d-none d-lg-block">
                <div class="auth-visual-side visual-bg-maintenance">
                    <!-- Fluffy Top Cloud -->
                    <div class="cloud cloud-top-left"></div>

                    <!-- Floating Checkmark Badge -->
                    <div class="floating-badge badge-check">
                        <svg width="68" height="68" viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="68" height="68" rx="24" fill="#FFFFFF" />
                            <circle cx="34" cy="34" r="22" fill="#2FA857" fill-opacity="0.2" />
                            <path d="M25 34.5L31.5 41L44 28" stroke="#1E6B37" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>

                    <!-- Floating Lock Badge -->
                    <div class="floating-badge badge-lock">
                        <svg width="74" height="88" viewBox="0 0 74 88" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="5" y="28" width="64" height="54" rx="16" fill="#FFFFFF" />
                            <path d="M19 28V20C19 10.0589 27.0589 2 37 2C46.9411 2 55 10.0589 55 20V28" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
                            <circle cx="37" cy="50" r="5" fill="#1E6B37" />
                            <path d="M37 55V63" stroke="#1E6B37" stroke-width="4" stroke-linecap="round" />
                        </svg>
                    </div>

                    <!-- Smartphone Mockup with Maintenance Graphic -->
                    <div class="position-relative" style="z-index: 2; width: 280px;">
                        <svg viewBox="0 0 300 520" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 25px 40px rgba(0, 0, 0, 0.28));">
                            <!-- Phone Body -->
                            <rect x="10" y="10" width="280" height="500" rx="42" fill="#0E2314" stroke="#1D4C2B" stroke-width="5" />
                            <!-- Screen -->
                            <rect x="20" y="20" width="260" height="480" rx="36" fill="url(#screenGradMaint)" />
                            <!-- Speaker / Camera Notch -->
                            <rect x="110" y="30" width="80" height="6" rx="3" fill="#0B1A0E" />
                            <circle cx="195" cy="33" r="3" fill="#1C3822" />

                            <!-- Screen Header -->
                            <circle cx="50" cy="70" r="14" fill="#FFFFFF" fill-opacity="0.25" />
                            <rect x="75" y="65" width="70" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.8" />
                            <circle cx="250" cy="70" r="8" fill="#FFFFFF" fill-opacity="0.3" />

                            <!-- Central Maintenance Tools Circle -->
                            <circle cx="150" cy="220" r="60" fill="#FFFFFF" fill-opacity="0.15" />
                            <circle cx="150" cy="220" r="48" fill="#FFFFFF" fill-opacity="0.22" />
                            <!-- Wrench & Gear Graphic -->
                            <circle cx="150" cy="220" r="28" fill="#D4AF37" />
                            <path d="M142 208L148 214M158 224L162 228" stroke="#134C25" stroke-width="5" stroke-linecap="round" />
                            <path d="M140 230L158 212" stroke="#134C25" stroke-width="5" stroke-linecap="round" />

                            <!-- Progress Bar -->
                            <rect x="65" y="320" width="170" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25" />
                            <rect x="65" y="320" width="140" height="8" rx="4" fill="#D4AF37" />

                            <!-- Subtext in Screen -->
                            <rect x="85" y="350" width="130" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.6" />
                            <rect x="105" y="370" width="90" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.4" />

                            <!-- Bottom Home Bar -->
                            <rect x="105" y="480" width="90" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.6" />

                            <!-- Gradients -->
                            <defs>
                                <linearGradient id="screenGradMaint" x1="20" y1="20" x2="280" y2="500" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#2FA857" />
                                    <stop offset="0.6" stop-color="#1E6B37" />
                                    <stop offset="1" stop-color="#0E3319" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    <!-- Fluffy Bottom Cloud -->
                    <div class="cloud cloud-bottom-right"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API Client JS -->
    <script src="js/api.js"></script>

    <script>
        document.getElementById('maintLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('maintEmail').value.trim();
            const password = document.getElementById('maintPassword').value;
            const submitBtn = document.getElementById('maintSubmitBtn');

            if (!email || !password) {
                showFeedback('maintFeedback', 'Please provide both your official email and password.', 'error');
                return;
            }

            await handleLogin({
                email,
                password,
                portalRole: 'maintenance',
                feedbackId: 'maintFeedback',
                submitBtn
            });
        });
    </script>
</body>
</html>
